'name': 'Repository Hygiene'

'on':
  'pull_request':
    'types':
      - 'opened'
      - 'reopened'
      - 'synchronize'
      - 'edited'

'concurrency':
  'group': '${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'
  'pull-requests': 'read'

'jobs':
  'repository-hygiene':
    'uses': 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@38aa4e9ea4a2adfdcfc210967f540023e05bca07' # v0.48.0
    'with':
      'package-proxy-guard': 'enforce'
    'secrets': 'inherit'
