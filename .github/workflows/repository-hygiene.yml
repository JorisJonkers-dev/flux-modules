'name': 'Repository Hygiene'

'on':
  'pull_request':

'concurrency':
  'group': '${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'
  'pull-requests': 'read'

'jobs':
  'repository-hygiene':
    'uses': 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@v0.8.0'
    'secrets': 'inherit'
